recipe: default.v1
assistant_id: rasa-eco-travel-advisor
language: en

# Baseline pipeline: DIETClassifier on spaCy features.
# Runs comfortably under 3s on CPU and is the recommended starting point.
pipeline:
  - name: SpacyNLP
    model: "en_core_web_md"
  - name: SpacyTokenizer
  - name: SpacyFeaturizer
  - name: RegexFeaturizer
  - name: LexicalSyntacticFeaturizer
  - name: CountVectorsFeaturizer
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 1
    max_ngram: 4
  - name: DIETClassifier
    epochs: 100
    constrain_similarities: true
  - name: EntitySynonymMapper
  - name: ResponseSelector
    epochs: 100
  - name: FallbackClassifier
    threshold: 0.65
    ambiguity_threshold: 0.1

# OPTIONAL upgrade path (only if latency stays < 3s in your environment):
# swap SpacyNLP + SpacyFeaturizer for:
#   - name: HFTransformersNLP
#     model_name: "distilbert"
#     model_weights: "distilbert-base-uncased"
#   - name: LanguageModelTokenizer
#   - name: LanguageModelFeaturizer

policies:
  - name: MemoizationPolicy
  - name: RulePolicy
    core_fallback_threshold: 0.4
    core_fallback_action_name: "action_two_stage_clarification"
    enable_fallback_prediction: true
  - name: TEDPolicy
    max_history: 5
    epochs: 100
