    - slot_was_set:
        - requested_slot: sustainability_level
    - intent: provide_sustainability_preference
      entities:
        - sustainability_level: high
    - slot_was_set:
        - sustainability_level: high
    - action: trip_intake_form
    - active_loop: null
    - slot_was_set:
        - requested_slot: null
